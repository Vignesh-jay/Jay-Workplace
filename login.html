<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Jay Workplace</title>

    <link rel="icon" href="favicon.ico" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <div class="login-container">
      <div class="login-card shadow">
        <!-- Logo -->

        <div class="text-center mb-4">
          <div class="logo-circle mb-3">
            <i class="bi bi-buildings-fill"></i>
          </div>

          <h2 class="fw-bold mb-1">Jay Workplace</h2>

          <p class="text-muted mb-0">Asset & Workforce Management</p>
        </div>

        <!-- Login Form -->

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label"> Email Address </label>

            <input
              id="email"
              type="email"
              class="form-control"
              placeholder="name@company.com"
              autocomplete="username"
              autofocus
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label"> Password </label>

            <div class="input-group">
              <input
                id="password"
                type="password"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />

              <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword">
                <i id="passwordIcon" class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input id="rememberMe" class="form-check-input" type="checkbox" />

              <label class="form-check-label" for="rememberMe"> Remember Me </label>
            </div>
          </div>

          <div id="loginError" class="alert alert-danger d-none mb-3"></div>

          <button id="btnLogin" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>

            Sign In
          </button>
        </form>

        <hr class="my-4" />

        <div class="text-center small text-muted">
          Version 1.0.0

          <br />

          © 2026 Jay Workplace
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>

    <script src="js/auth/auth.js"></script>

    <script src="js/auth/login.js"></script>
  </body>
</html>
