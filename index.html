<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jay Workplace</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- ChartJS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="logo">
          <div class="logo-wrapper">
            <div class="logo-icon">JW</div>
            <div class="logo-text">
              <h4>Jay Workplace</h4>
              <span>Asset Management</span>
            </div>
          </div>
        </div>

        <ul class="nav-menu">
          <li id="nav-dashboard" onclick="loadDashboard()">
            <i class="fas fa-home"></i>
            Dashboard
          </li>
          <li id="nav-workforce" onclick="loadWorkforce()">
            <i class="fas fa-users"></i>
            Workforce
          </li>
          <li id="nav-assets" onclick="loadAssets()">
            <i class="fas fa-laptop"></i>
            Assets
          </li>
          <li id="nav-assignments" onclick="loadAssignments()">
            <i class="fas fa-right-left"></i>
            Assignments
          </li>
          <li id="nav-reports" onclick="loadReports()">
            <i class="fas fa-chart-column"></i>
            Reports
          </li>
          <li id="nav-administration" onclick="loadAdministration()">
            <i class="fas fa-gear"></i>
            Administration
          </li>
        </ul>
      </aside>

      <!-- Main Area -->
      <main class="main-content">
        <header class="topbar">
          <div class="position-relative search-wrapper">
            <div class="search-box">
              <i class="bi bi-search search-icon"></i>

              <input
                id="globalSearchInput"
                class="form-control"
                type="search"
                placeholder="Search Assets, Employees, Locations..."
                autocomplete="off"
              />

              <button id="clearSearchBtn" class="search-clear d-none" onclick="clearGlobalSearch()">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>

            <div id="globalSearchResults" class="global-search-results d-none"></div>
          </div>

          <div class="user-profile">
            <div class="avatar">A</div>

            <div class="user-details">
              <div class="user-name">Admin User</div>
              <div class="user-role">Administrator</div>
            </div>

            <i class="fas fa-chevron-down"></i>
          </div>
        </header>

        <div id="content"></div>
      </main>
    </div>
    <div class="modal fade" id="employeeImportModal" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Import Employees</h5>

            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label"> Excel File </label>

              <input
                id="employeeImportFile"
                type="file"
                class="form-control"
                accept=".xlsx,.xls,.csv"
              />
            </div>

            <button id="btnDownloadEmployeeTemplate" class="btn btn-outline-secondary">
              Download Sample Template
            </button>

            <hr />

            <div id="employeeImportPreview">
              <div class="text-center text-muted py-5">No file selected.</div>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

            <button id="btnEmployeeImport" class="btn btn-primary" disabled>
              Import Employees
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Import Result Modal -->
    <div class="modal fade" id="importResultModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Import Result</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div id="importResultContent" class="text-center"></div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary" data-bs-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal fade" id="assetImportModal" tabindex="-1">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Import Assets</h5>

            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label"> Excel File </label>

              <input
                id="assetImportFile"
                type="file"
                class="form-control"
                accept=".xlsx,.xls,.csv"
              />
            </div>

            <button id="btnDownloadAssetTemplate" class="btn btn-outline-secondary">
              Download Sample Template
            </button>

            <hr />

            <div id="assetImportPreview">
              <div class="text-center text-muted py-5">No file selected.</div>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

            <button id="btnAssetImport" class="btn btn-primary" disabled>Import Assets</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/auditlog.service.js"></script>

    <script src="js/transfer.service.js"></script>

    <script src="js/location.service.js"></script>
    <script src="js/assetStatuses.js"></script>
    <script src="js/assetStatus.service.js"></script>
    <script src="js/locations.js"></script>

    <script src="js/auditlogs.js"></script>
    <script src="js/api.js"></script>
    <script src="js/department.service.js"></script>
    <script src="js/departments.js"></script>

    <script src="js/assignment.service.js"></script>
    <script src="js/activity.service.js"></script>
    <script src="js/utils/activity.utils.js"></script>
    <script src="js/employee-history.service.js"></script>
    <script src="js/employee.service.js"></script>
    <script src="js/asset.service.js"></script>

    <script src="js/store.js"></script>
    <script src="js/data.js"></script>

    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>

    <script src="js/workforce.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/assignments.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/administration.js"></script>

    <script src="js/search.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script src="js/Import/session.js"></script>
    <script src="js/Import/constants.js"></script>
    <script src="js/Import/parser.js"></script>
    <script src="js/Import/preview.js"></script>
    <script src="js/Import/validator.js"></script>
    <script src="js/Import/service.js"></script>
    <script src="js/Import/result-modal.js"></script>
    <script src="js/Import/import-handler.js"></script>
    <script src="js/Import/template.js"></script>
    <script src="js/Import/employee-import.js"></script>
    <script src="js/Import/asset-modal.js"></script>
    <script src="js/Import/preview-assets.js"></script>
    <script src="js/Import/asset-session.js"></script>
    <script src="js/Import/asset-import.js"></script>
    <script src="js/Import/import.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
